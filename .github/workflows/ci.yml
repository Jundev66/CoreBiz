name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the automatic token. The workflow only reads the code; gitleaks
# also reads pull request commits. Nothing here needs to write to the repository.
permissions:
  contents: read
  pull-requests: read

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene sentido
# gastar minutos verificando un commit que ya quedo atras.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Formato, lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formato
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck

  architecture:
    name: Limites hexagonales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Si esto falla, alguien acaba de acoplar el dominio a la infraestructura.
      # No es un aviso de estilo: la arquitectura del proyecto depende de este check.
      - name: Verificar dependencias entre capas
        run: pnpm arch

  api:
    name: La API compila y arranca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # El artefacto que corre en Render es este, no el codigo fuente. Los paquetes
      # del monorepo se consumen como TypeScript crudo y Node no sabe cargarlos:
      # `tsc` los compila dentro de dist/ y `tsc-alias` reescribe los `require`
      # para que apunten ahi. Si ese puente se rompe, se rompe AQUI y no en el
      # primer arranque de produccion.
      - name: Compilar
        run: pnpm --filter @corebiz/api build

      # Compilar no basta: la inyeccion de dependencias de Nest se resuelve al
      # levantar, no al compilar. Un provider mal declarado pasa `tsc` sin una
      # queja y revienta en el arranque, que es exactamente lo que Render haria
      # revertir. Se arranca con el driver de pruebas para no necesitar Postgres,
      # y por eso hace falta el permiso explicito: fuera de la suite, el proceso
      # se niega a levantar en memoria.
      - name: Arrancar y consultar el endpoint de salud
        run: |
          set -euo pipefail
          node apps/api/dist/apps/api/src/main.js &
          api_pid=$!
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health > /tmp/health.json; then
              echo "Arranco al intento $attempt:"
              cat /tmp/health.json
              kill "$api_pid"
              exit 0
            fi
            sleep 1
          done
          echo "::error::La API no respondio en 30 segundos."
          kill "$api_pid" || true
          exit 1
        env:
          DATA_DRIVER: memory
          ALLOW_MEMORY_DRIVER: '1'
          PORT: '3001'

  unit:
    name: Tests unitarios y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los umbrales de cobertura del dominio viven en vitest.config.ts y rompen el build.
      - name: Ejecutar tests
        run: pnpm test:coverage
      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  secrets:
    name: Fuga de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  non-fiscal-guard:
    name: Guardianes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # CoreBiz emite NOTAS DE ENTREGA, documentos sin valor fiscal. Este check impide
      # que en algun momento se cuele vocabulario de facturacion fiscal en el producto,
      # que es justo lo que crearia un problema legal para el negocio.
      - name: Verificar que no aparece vocabulario fiscal
        run: bash scripts/check-non-fiscal.sh
      # Supabase manda las migraciones. Un `prisma migrate` compararia contra una base
      # sombra sin politicas RLS ni funciones SECURITY DEFINER, y generaria un diff que
      # las BORRA — es decir, cada empresa pasaria a ver las demas.
      - name: Verificar que Prisma no gestiona migraciones
        run: bash scripts/check-prisma-owns-nothing.sh
      # Una clave sin traducir no rompe nada: next-intl pinta la clave en crudo. La
      # pantalla responde 200 y no deja error de consola, asi que `pnpm approve` la da
      # por buena y el fallo espera a que alguien abra esa pantalla en ese idioma.
      - name: Verificar la paridad de los dos idiomas
        run: bash scripts/check-i18n-parity.sh
      # The assistant explains errors by reading the support catalogue. An undeclared new
      # error key raises no error: the panel simply goes quiet, on the one screen people
      # turn to when they do not know what to do.
      - name: Check the support catalogue
        run: bash scripts/check-playbooks.sh

  integration:
    name: Persistencia y matriz de aislamiento RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `ubuntu-latest` trae Docker preinstalado, asi que Supabase local arranca sin
      # provisionar nada. Es lo que permite que las politicas RLS se EJECUTEN en cada
      # push en lugar de quedarse como una hipotesis escrita en un archivo SQL.
      - name: Levantar Supabase local
        run: pnpm db:start

      # La matriz recorre TODA tabla con tenant_id descubierta del catalogo y exige
      # cero filas en select, update y delete cruzados. Si alguien anade una tabla
      # nueva sin politica, este job se pone en rojo sin que nadie tenga que acordarse.
      # Dos suites: la matriz de aislamiento contra los adaptadores Drizzle, y la de
      # la API, que levanta NestJS de verdad y le habla por HTTP con dos identidades
      # distintas para comprobar que un proceso de larga vida no mezcla empresas.
      - name: Matriz de aislamiento, adaptadores Drizzle y API
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321

      # Cachear los navegadores aqui tambien: la clave es la misma que en el job e2e,
      # asi que el segundo que corra reutiliza la descarga del primero.
      - name: Cachear navegadores de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @corebiz/e2e exec playwright install chromium --with-deps

      # Las dos aplicaciones, porque desde la migracion a NestJS la suite arranca dos
      # servidores. Construir solo la web dejaria a Playwright esperando a una API que
      # no existe, con un timeout que no menciona la causa.
      - name: Construir la API y la aplicacion contra Postgres
        run: pnpm --filter @corebiz/api build && pnpm --filter @corebiz/web exec next build
        env:
          DATA_DRIVER: postgres

      # LOS MISMOS escenarios Gherkin que el job e2e corre en memoria, ahora contra
      # Postgres con RLS activo. Que ninguno necesite cambiar es la comprobacion
      # ejecutable de que la arquitectura hexagonal es real y no decorativa: si el
      # dominio supiera de la base de datos, esta linea no podria existir.
      #
      # Se corre la suite ENTERA y no solo los BDD, porque hay specs que solo
      # tienen sentido con base de datos y por tanto SOLO se ejecutan aqui: el
      # alta de cuenta, el aislamiento entre dos cuentas reales, y el que
      # comprueba que dos visitantes de la demostracion no se ven entre si.
      - name: La suite completa, ahora sobre Postgres
        run: pnpm test:e2e:pg
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321

      - name: Publicar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-postgres
          path: e2e/playwright-report/
          retention-days: 7

      - name: Apagar Supabase
        if: always()
        run: pnpm db:stop

  e2e:
    name: E2E y BDD (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Solo Chromium: Firefox y WebKit anaden ~60 s de descarga por corrida y aportan
      # poco en una aplicacion que no usa APIs especificas de navegador.
      - name: Cachear navegadores de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @corebiz/e2e exec playwright install chromium --with-deps

      # Las dos aplicaciones corren con el driver de pruebas: sin Postgres y sin Docker,
      # con datos sembrados de forma determinista. La suite no depende de ningun servicio,
      # y que eso siga siendo cierto DESPUES de partir el sistema en dos procesos es la
      # comprobacion de que el hexagono aguanta el cambio de adaptador primario.
      #
      # Quien arranca los procesos de verdad es el `webServer` de Playwright, y es el que
      # lleva el permiso del driver. Aqui las dos variables van juntas de todos modos: un
      # par a medias es una invitacion a que alguien copie solo la primera.
      - name: Construir la API y la aplicacion
        run: pnpm --filter @corebiz/api build && pnpm --filter @corebiz/web exec next build
        env:
          DATA_DRIVER: memory
          ALLOW_MEMORY_DRIVER: '1'

      - name: Generar escenarios BDD
        run: pnpm --filter @corebiz/e2e exec bddgen

      - name: Ejecutar E2E y BDD
        run: pnpm --filter @corebiz/e2e exec playwright test

      # El reporte HTML lleva trazas y video de cada fallo: es lo que hace depurable
      # un fallo intermitente de CI sin tener que reproducirlo a mano.
      - name: Publicar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
