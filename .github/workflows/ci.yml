name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene sentido
# gastar minutos verificando un commit que ya quedo atras.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Formato, lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formato
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck

  architecture:
    name: Limites hexagonales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Si esto falla, alguien acaba de acoplar el dominio a la infraestructura.
      # No es un aviso de estilo: la arquitectura del proyecto depende de este check.
      - name: Verificar dependencias entre capas
        run: pnpm arch

  unit:
    name: Tests unitarios y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los umbrales de cobertura del dominio viven en vitest.config.ts y rompen el build.
      - name: Ejecutar tests
        run: pnpm test:coverage
      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  secrets:
    name: Fuga de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  non-fiscal-guard:
    name: Guardia de lenguaje no fiscal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # CoreBiz emite NOTAS DE ENTREGA, documentos sin valor fiscal. Este check impide
      # que en algun momento se cuele vocabulario de facturacion fiscal en el producto,
      # que es justo lo que crearia un problema legal para el negocio.
      - name: Verificar que no aparece vocabulario fiscal
        run: bash scripts/check-non-fiscal.sh

  integration:
    name: Persistencia y matriz de aislamiento RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `ubuntu-latest` trae Docker preinstalado, asi que Supabase local arranca sin
      # provisionar nada. Es lo que permite que las politicas RLS se EJECUTEN en cada
      # push en lugar de quedarse como una hipotesis escrita en un archivo SQL.
      - name: Levantar Supabase local
        run: pnpm db:start

      # La matriz recorre TODA tabla con tenant_id descubierta del catalogo y exige
      # cero filas en select, update y delete cruzados. Si alguien anade una tabla
      # nueva sin politica, este job se pone en rojo sin que nadie tenga que acordarse.
      - name: Matriz de aislamiento y adaptadores Drizzle
        run: pnpm test:integration

      # Cachear los navegadores aqui tambien: la clave es la misma que en el job e2e,
      # asi que el segundo que corra reutiliza la descarga del primero.
      - name: Cachear navegadores de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @corebiz/e2e exec playwright install chromium --with-deps

      - name: Construir la aplicacion contra Postgres
        run: pnpm --filter @corebiz/web exec next build
        env:
          DATA_DRIVER: postgres

      # LOS MISMOS escenarios Gherkin que el job e2e corre en memoria, ahora contra
      # Postgres con RLS activo. Que ninguno necesite cambiar es la comprobacion
      # ejecutable de que la arquitectura hexagonal es real y no decorativa: si el
      # dominio supiera de la base de datos, esta linea no podria existir.
      - name: Los mismos escenarios BDD, ahora sobre Postgres
        run: pnpm test:bdd:pg
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Publicar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-postgres
          path: e2e/playwright-report/
          retention-days: 7

      - name: Apagar Supabase
        if: always()
        run: pnpm db:stop

  e2e:
    name: E2E y BDD (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Solo Chromium: Firefox y WebKit anaden ~60 s de descarga por corrida y aportan
      # poco en una aplicacion que no usa APIs especificas de navegador.
      - name: Cachear navegadores de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @corebiz/e2e exec playwright install chromium --with-deps

      # La aplicacion corre en modo memoria: sin Postgres y sin Docker, con datos
      # sembrados de forma determinista. La suite no depende de ningun servicio.
      - name: Construir la aplicacion
        run: pnpm --filter @corebiz/web exec next build
        env:
          DATA_DRIVER: memory

      - name: Generar escenarios BDD
        run: pnpm --filter @corebiz/e2e exec bddgen

      - name: Ejecutar E2E y BDD
        run: pnpm --filter @corebiz/e2e exec playwright test

      # El reporte HTML lleva trazas y video de cada fallo: es lo que hace depurable
      # un fallo intermitente de CI sin tener que reproducirlo a mano.
      - name: Publicar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
