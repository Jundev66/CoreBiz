# Keeps dependencies and CI actions patched now that the repository is public.
#
# Weekly and grouped, so a small project gets one pull request per ecosystem instead of a
# stream of them. Security fixes are separate: GitHub opens those as soon as an advisory
# appears, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # jose 6 is ESM-only and the API is CommonJS on Vercel, where `require(esm)` is not
      # available: the function fails on load. See apps/api/src/auth/supabase-jwt.verifier.ts.
      - dependency-name: jose
        update-types: ['version-update:semver-major']
      # NestJS 12 ships every package as ESM only, consumed from CommonJS through
      # `require(esm)` — the same wall as jose 6 on Vercel. The upgrade needs the API to move
      # to ESM (or a runtime with `require(esm)`), not a version bump. Dependabot opened
      # @nestjs/common and @nestjs/platform-express 12 separately and both broke the build.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned by commit SHA in the workflows; Dependabot bumps the SHA and keeps
  # the version comment next to it up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
