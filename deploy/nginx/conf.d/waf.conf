map $request_uri $is_malicious_request_uri {
    default 0;
    "~*(\.\./|\.\.\\)" 1;
    "~*(\/etc\/(passwd|shadow|hosts))" 1;
    "~*(\.env|\.git|\.dockerignore|\.aws)" 1;
    "~*(<script|javascript:|onerror=|onload=|document\.cookie)" 1;
    "~*(union.*select.*from|select.*from.*where|insert.*into|drop.*table|truncate.*table)" 1;
}

map $query_string $is_malicious_query_string {
    default 0;
    "~*(\.\./|\.\.\\)" 1;
    "~*(<script|javascript:|onerror=|onload=|eval\(|document\.cookie)" 1;
    "~*(union(\s+|\+)+(all(\s+|\+)+)?select|information_schema|waitfor(\s+|\+)delay|benchmark\()" 1;
    "~*(exec(\s+|\+)+(xp_|sp_)|select(\s+|\+).*from|drop(\s+|\+)table)" 1;
}

map $http_user_agent $is_malicious_user_agent {
    default 0;
    "~*(sqlmap|nikto|acunetix|wpscan|nmap|masscan|nessus|zgrab)" 1;
}
