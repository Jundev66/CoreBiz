services:
  nginx:
    image: nginx:1.27-alpine
    container_name: corebiz_reverse_proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - api
    networks:
      - corebiz_network

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: corebiz_api_server
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: bullmq
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ALLOWED_IP_LIST: ${ALLOWED_IP_LIST:-}
      ENFORCE_IP_ALLOWLIST: ${ENFORCE_IP_ALLOWLIST:-false}
    depends_on:
      - redis
    networks:
      - corebiz_network

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: corebiz_web_client
    restart: unless-stopped
    expose:
      - '3020'
    environment:
      NODE_ENV: production
      PORT: 3020
      NEXT_PUBLIC_API_URL: http://nginx/v1
    depends_on:
      - api
    networks:
      - corebiz_network

  redis:
    image: redis:7.4-alpine
    container_name: corebiz_redis_queue
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    networks:
      - corebiz_network

volumes:
  redis_data:

networks:
  corebiz_network:
    driver: bridge
