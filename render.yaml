# ─────────────────────────────────────────────────────────────────────────────
# CoreBiz API — despliegue en Render, plan gratuito.
#
# Esto es la mitad del despliegue. La otra mitad —apps/web— vive en Vercel, y el
# reparto de variables entre las dos esta en docs/DEPLOY.md y en .env.example.
#
# Por que dos plataformas y no una: Vercel no aloja un proceso de larga vida y Render
# no tiene el CDN ni el soporte para Next que tiene Vercel. Cada una hace lo que hace
# bien, y las dos son gratis.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: corebiz-api
    runtime: node
    plan: free
    # ⚠️ La MISMA region que el proyecto de Supabase. Sin esto cada consulta cruza
    # medio mundo y el tiempo de respuesta se dispara entre 150 y 300 ms — y eso es
    # POR CONSULTA, sobre una pantalla que hace cuatro.
    region: virginia
    branch: main
    autoDeploy: true

    # `--filter @corebiz/api...` CON los tres puntos: instala la API y el subgrafo de
    # paquetes del monorepo del que depende. Sin los puntos no instala los paquetes
    # workspace y el build falla resolviendo @corebiz/domain, con un error que habla de
    # un modulo que si existe.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter @corebiz/api... && pnpm --filter @corebiz/api build

    # Un solo arbol de archivos ya compilado. Node no tiene que resolver nada del
    # monorepo en tiempo de ejecucion: `tsc-alias` reescribio los `require` de
    # @corebiz/* para que apunten dentro de dist/.
    startCommand: node apps/api/dist/apps/api/src/main.js

    # Render lo consulta para decidir si un despliegue sale adelante. La ruta toca
    # Postgres de verdad, asi que un despliegue solo se da por bueno cuando la cadena
    # entera responde.
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: 22.21.0
      - key: NODE_ENV
        value: production
      - key: DATA_DRIVER
        value: postgres

      # DIEZ, no uno. Uno es lo correcto en serverless —cada invocacion puede ser un
      # proceso nuevo— y es MALO aqui: la API es un proceso de larga vida y con el pool
      # en uno cada transaccion retiene la unica conexion mientras dura, asi que todo
      # lo demas espera en fila. El mismo fallo esta documentado en el addendum de
      # docs/adr/004-drizzle-sobre-postgrest.md.
      - key: DATABASE_MAX_CONNECTIONS
        value: '10'

      # `sync: false` = se rellena a mano en el panel y NO viaja en el repositorio.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false

      # NO va aqui `REQUEST_HASH_SECRET`. La IP se hashea en Vercel, que es el unico
      # sitio donde `x-forwarded-for` es de fiar; a la API solo le llega el hash. Si se
      # pusiera aqui, quien siguiera la guia lo daria por configurado y la web caeria a
      # la sal por defecto del codigo — con la que el hash se puede deshacer.

      # Compartido con Vercel para los endpoints internos. Se genera aqui y se copia
      # al panel de Vercel: es el unico secreto que tienen que tener igual los dos.
      - key: INTERNAL_API_SECRET
        generateValue: true

      - key: DEMO_ENABLED
        value: 'true'
      - key: DEMO_TTL_HOURS
        value: '24'
      - key: DEMO_MAX_CONCURRENT
        value: '50'
      - key: DEMO_MAX_PER_HOUR
        value: '1'
