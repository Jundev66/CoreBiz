packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# Scripts de instalacion permitidos explicitamente.
#
# pnpm bloquea por defecto los scripts postinstall de las dependencias, que es un
# vector real de ataque en la cadena de suministro: un paquete comprometido ejecuta
# codigo arbitrario en cada `install`, tambien en CI. Aqui solo se autoriza a los
# que descargan binarios nativos y realmente los necesitan.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - '@swc/core'
  - '@parcel/watcher'
  - esbuild
  - sharp
  - supabase
  - lefthook
  - unrs-resolver
  # Prisma trae un `preinstall` que prepara su CLI. Sin autorizarlo, `pnpm install`
  # termina sin el y `prisma generate` falla en el despliegue, no en local.
  - prisma
  - '@prisma/engines'

# Correcciones a dependencias mal declaradas por terceros.
#
# Con `hoist=false` estas omisiones dejan de ser invisibles y rompen en el arranque,
# que es justo lo que se busca. `packageExtensions` las corrige en el sitio adecuado
# —la declaracion del paquete— en lugar de relajar el aislamiento de todo el monorepo.
packageExtensions:
  playwright-bdd:
    dependencies:
      # playwright-bdd resuelve `playwright` y `playwright-core` en runtime, pero solo
      # declara `@playwright/test` como peer.
      playwright: '*'
      playwright-core: '*'
